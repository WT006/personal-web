<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慢一点 · 专注当下</title><link rel="icon" href="../assets/mark.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#414b3b;font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:2px solid #75876b;outline-offset:5px}header{padding:28px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font:24px "Songti SC",serif;letter-spacing:2px}header a{color:#858a7e;font-size:11px}main{max-width:600px;text-align:center;margin:40px auto 50px;padding:0 24px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#818975}h1{font:400 33px/1.6 "Songti SC",serif;letter-spacing:1px;margin:20px 0 0}.intro{font-size:12px;color:#898d81;margin:12px 0 26px}.modes{display:inline-flex;gap:6px;border:1px solid #ddded2;padding:5px;border-radius:30px}.mode{background:none;color:#929789;border-radius:25px;padding:6px 17px;font-size:11px}.mode[aria-pressed=true]{background:#e3e7d9;color:#59644d}.timer-ring{--progress:0deg;position:relative;width:280px;height:280px;border-radius:50%;background:conic-gradient(#7b8c67 var(--progress),#d7d9ca 0);padding:2px;margin:33px auto 30px;transform:rotate(-90deg)}.timer-ring:after{content:'';position:absolute;inset:13px;border:1px solid #e1e1d5;border-radius:50%;pointer-events:none}.timer{width:100%;height:100%;border-radius:50%;background:#f3f0e9;display:flex;align-items:center;justify-content:center;flex-direction:column;transform:rotate(90deg)}.time{font:60px/1 Georgia,serif;letter-spacing:3px;font-variant-numeric:tabular-nums}.status{font-size:9px;letter-spacing:2px;color:#959b8a;margin-top:18px}.actions{display:flex;align-items:center;justify-content:center;gap:17px}.start{background:#5d6b4f;color:#faf9f2;padding:12px 35px;border-radius:30px;min-width:140px;font-size:12px;transition:background .3s}.start:hover{background:#49563d}.reset{padding:11px 19px;background:none;color:#8b9381;font-size:12px;border:1px solid #d9ddcf;border-radius:30px}.footnote{font-size:11px;color:#979c8d;margin-top:35px}@media(max-width:500px){main{margin-top:28px}header{padding:24px}h1{font-size:29px}.timer-ring{width:250px;height:250px}.time{font-size:54px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><span class="logo">慢一点.</span><a href="../#/works">返回作品 ↗</a></header><main><div class="eyebrow">ONE THING AT A TIME</div><h1>现在，只做一件事。</h1><p class="intro">把接下来的一小段时间，完整地留给自己。</p><div class="modes" role="group" aria-label="计时模式"><button type="button" class="mode" data-minutes="25" aria-pressed="true">专注 25 分钟</button><button type="button" class="mode" data-minutes="5" aria-pressed="false">休息 5 分钟</button></div><div class="timer-ring" id="ring"><div class="timer"><div class="time" id="time" role="timer">25:00</div><div class="status" id="status">READY WHEN YOU ARE</div></div></div><div class="actions"><button type="button" class="start" id="start">开始专注</button><button type="button" class="reset" id="reset">重置</button></div><p class="footnote" id="note" role="status" aria-live="polite">不着急，一件一件来。</p></main><script>
let duration=25*60,remaining=duration,running=false,endTime=0;const time=document.getElementById('time'),start=document.getElementById('start'),status=document.getElementById('status'),ring=document.getElementById('ring'),note=document.getElementById('note');
function render(){const seconds=Math.ceil(remaining);time.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');ring.style.setProperty('--progress',((duration-remaining)/duration*360)+'deg');start.textContent=running?'暂停':remaining===duration?(duration===1500?'开始专注':'开始休息'):'继续';status.textContent=running?'STAY WITH THIS MOMENT':remaining===duration?'READY WHEN YOU ARE':'TAKE YOUR TIME';document.title=(running?time.textContent+' · ':'')+'慢一点 · 专注当下'}
start.addEventListener('click',()=>{if(running){remaining=Math.max(0,(endTime-Date.now())/1000);running=false}else{if(remaining<=0)remaining=duration;endTime=Date.now()+remaining*1000;running=true;note.textContent=duration===1500?'把注意力，轻轻放回当下。':'让眼睛和思绪，都休息一会儿。'}render()});
function reset(){running=false;remaining=duration;note.textContent='不着急，一件一件来。';render()}
document.getElementById('reset').addEventListener('click',reset);document.querySelectorAll('[data-minutes]').forEach(button=>button.addEventListener('click',()=>{duration=Number(button.dataset.minutes)*60;document.querySelectorAll('[data-minutes]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));reset()}));
setInterval(()=>{if(!running)return;remaining=Math.max(0,(endTime-Date.now())/1000);if(remaining===0){running=false;note.textContent=duration===1500?'这一段专注完成了，休息一下吧。':'休息结束，准备好再慢慢开始。'}render()},250);render();
</script></body></html>
