<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾色 · 把喜欢的颜色收进口袋</title><link rel="icon" href="../assets/mark.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#30372e;font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:2px solid #6b795b;outline-offset:5px}header{padding:28px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font:24px "Songti SC",serif;letter-spacing:2px}header a{color:#818679;font-size:11px}main{max-width:1150px;margin:45px auto;padding:0 5vw}.eyebrow{font-size:10px;letter-spacing:2px;color:#7d876e;margin-bottom:16px}h1{font:400 42px/1.5 "Songti SC",serif;margin:0}p{color:#818679;margin:14px 0 35px;font-size:13px}.palette{display:grid;grid-template-columns:repeat(5,1fr);border-radius:8px;overflow:hidden;box-shadow:0 20px 35px -30px #24341c40}.swatch{min-height:330px;display:flex;align-items:flex-end;justify-content:center;padding:25px 8px;transition:background .5s ease,color .5s ease;position:relative}.swatch span{font-size:12px;letter-spacing:1px}.swatch:after{content:'点击复制';position:absolute;left:0;right:0;text-align:center;bottom:50px;font-size:10px;opacity:0;transform:translateY(3px);transition:.25s}.swatch:hover:after{opacity:.8;transform:none}.controls{display:flex;align-items:center;justify-content:space-between;margin-top:30px;gap:20px}.controls button{background:#303b2b;color:#f5f5ee;padding:12px 25px;border-radius:30px;font-size:12px;transition:transform .3s}.controls button:hover{transform:translateY(-2px)}.name{font-family:"Songti SC",serif;font-size:20px}.name small{font:10px -apple-system,sans-serif;color:#818679;margin-left:14px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,10px);opacity:0;background:#303b2b;color:#f5f5ee;border-radius:25px;padding:9px 20px;font-size:12px;transition:.3s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}.footer{font-size:10px;color:#94988e;margin-top:40px;text-align:center}footer a{text-decoration:underline;text-underline-offset:3px}@media(max-width:600px){header{padding:25px 24px}main{margin:30px auto;padding:0 24px}h1{font-size:32px}.palette{grid-template-columns:1fr}.swatch{min-height:78px;justify-content:flex-end;align-items:center;padding:20px}.swatch:after{right:auto;left:20px;bottom:auto;opacity:.65}.controls{align-items:center}.name small{display:block;margin:4px 0 0}.footer{margin-top:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><span class="logo">拾色.</span><a href="../#/works">返回作品 ↗</a></header><main><div class="eyebrow">COLORS, COLLECTED.</div><h1>给今天，换一种颜色。</h1><p>从自然里拾一点灵感。点击色块，带走你喜欢的颜色。</p><div class="palette" id="palette" aria-label="当前配色"></div><div class="controls"><span class="name" id="palette-name"></span><button id="next" type="button">换一组配色 ↗</button></div><p class="footer">留一点颜色，给平常的日子。</p></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const palettes=[{name:'苔原',en:'MOSS & MORNING',colors:['#374238','#68775C','#A7B294','#D6D9C8','#EFECE2']},{name:'海边来信',en:'LETTERS FROM THE COAST',colors:['#354B55','#6A8D94','#A6C4C0','#DDD8C4','#F0E9DA']},{name:'旧书与咖啡',en:'PAPER & COFFEE',colors:['#4F4139','#8C7060','#BA9E86','#D8C8AF','#F0E8D9']},{name:'黄昏散步',en:'AN EVENING WALK',colors:['#4E4A58','#827381','#B79B9F','#D4BCB3','#EDE1D5']},{name:'小小花园',en:'A LITTLE GARDEN',colors:['#334B40','#6A815F','#A4AD7C','#D1BE87','#F0E5C6']}];
let index=0,timeout;const palette=document.getElementById('palette');
function textColor(hex){const c=hex.slice(1).match(/../g).map(x=>parseInt(x,16));return c[0]*.299+c[1]*.587+c[2]*.114>155?'#31372D':'#F8F7F0'}
function render(){const p=palettes[index];document.getElementById('palette-name').innerHTML=p.name+'<small>'+p.en+'</small>';palette.replaceChildren();p.colors.forEach(color=>{const button=document.createElement('button');button.type='button';button.className='swatch';button.style.background=color;button.style.color=textColor(color);button.setAttribute('aria-label','复制颜色 '+color);button.innerHTML='<span>'+color+'</span>';button.addEventListener('click',async()=>{let message;try{await navigator.clipboard.writeText(color);message=color+' 已复制'}catch{message='颜色：'+color+'，可手动复制'}const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('on');clearTimeout(timeout);timeout=setTimeout(()=>toast.classList.remove('on'),2200)});palette.append(button)})}
document.getElementById('next').addEventListener('click',()=>{index=(index+1)%palettes.length;render()});render();
</script></body></html>
